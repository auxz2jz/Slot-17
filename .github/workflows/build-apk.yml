name: Build 3D Scan Studio Android APK

on:
  push:
    branches: [main]
    paths:
      - "source/PhotogrammetryStudioAndroid-v0.26.0-Distortion-Aware-Laser-3D-Android-Studio-Ready.zip"
      - "PhotogrammetryStudioAndroid-v0.26.0-Distortion-Aware-Laser-3D-Android-Studio-Ready.zip"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Compile unchanged v0.26.0 source
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out build repository
        uses: actions/checkout@v4
      - name: Verify original v0.26.0 source archive
        shell: bash
        run: |
          set -euo pipefail
          archive="PhotogrammetryStudioAndroid-v0.26.0-Distortion-Aware-Laser-3D-Android-Studio-Ready.zip"
          if [[ ! -f "$archive" ]]; then archive="source/$archive"; fi
          test -f "$archive" || { echo "::error::Source ZIP missing in repository root or source/."; exit 1; }
          printf '%s  %s\n' '8a9155a10424dc6c255141c8a46ead78b826ba3bb566e639e33be9f5d4b5ea7e' "$archive" | sha256sum --check
          unzip -tq "$archive"
          mkdir -p "$RUNNER_TEMP/studio"
          unzip -q "$archive" -d "$RUNNER_TEMP/studio"
          test -f "$RUNNER_TEMP/studio/PhotogrammetryStudioAndroid_v0.26.0/settings.gradle.kts"
          echo "PROJECT_DIR=$RUNNER_TEMP/studio/PhotogrammetryStudioAndroid_v0.26.0" >> "$GITHUB_ENV"
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install required Android platform
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --channel=3 "platforms;android-37.0" "build-tools;36.0.0"
          if [[ -d "$ANDROID_HOME/platforms/android-37.0" && ! -e "$ANDROID_HOME/platforms/android-37" ]]; then
            ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
          fi
      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          JAVA_OPTS: "-Xmx2g"
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleDebug
      - name: Verify APK and record checksum
        run: |
          apk="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          sha256sum "$apk"
          file "$apk"
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: 3D-Scan-Studio-v0.26.0-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload diagnostic build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics-v0.26.0
          path: |
            ${{ env.PROJECT_DIR }}/app/build/reports/
          if-no-files-found: ignore
          retention-days: 14
